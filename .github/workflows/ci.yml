
name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run Tests
        run: mvn -B -Pqa clean verify

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: target/allure-results

  publish-allure:
    needs: test
    if: >-
      ${{
        needs.test.result == 'success' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        (github.ref_name == 'main' || github.ref_name == 'master')
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: allure-pages-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Restrict public report to the demo API
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          case "$BASE_URL" in
            ""|https://restful-booker.herokuapp.com|https://restful-booker.herokuapp.com/) ;;
            *) echo "::error::Public Allure reports are restricted to the demo API. BASE_URL points elsewhere."; exit 1 ;;
          esac

      - name: Check whether history branch exists
        id: history-branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API_URL/repos/$REPOSITORY/git/ref/heads/gh-pages")
          case "$status" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Failed to check gh-pages branch (HTTP $status)"; exit 1 ;;
          esac

      - name: Load previous Allure reports
        if: steps.history-branch.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: previous-gh-pages
          persist-credentials: false

      - name: Prepare report history
        if: steps.history-branch.outputs.exists == 'true'
        run: |
          mkdir gh-pages
          git -C previous-gh-pages archive HEAD | tar -x -C gh-pages
          test -d gh-pages/last-history || {
            echo "::error::The gh-pages branch exists but contains no Allure history."
            exit 1
          }

      - name: Download Allure results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: allure-results
          path: allure-results

      - name: Initialize history for the first report
        run: mkdir -p gh-pages/last-history

      - name: Build Allure report with history
        uses: simple-elf/allure-report-action@385367cde61ac68c2568a117f7579f7f148dc459 # v1.15
        with:
          allure_results: allure-results
          gh_pages: gh-pages
          allure_history: allure-history
          keep_reports: 20

      - name: Verify generated report
        run: |
          test -s allure-history/index.html
          test -s "allure-history/${GITHUB_RUN_NUMBER}/index.html"
          test -s allure-history/last-history/history.json

      - name: Save Allure reports to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: allure-history

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4